name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  # signls needs cgo for gomidi's rtmidi driver, so each platform is built on a
  # matching native runner. GoReleaser only compiles the targets selected by the
  # GR_TARGET env var (see .goreleaser.yaml).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history & tags for version/changelog

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"

      - name: Install ALSA headers
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Windows cross toolchain (mingw-w64)
        if: matrix.target == 'linux-amd64'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Run GoReleaser (release on tags, snapshot otherwise)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: >-
            ${{ startsWith(github.ref, 'refs/tags/v')
              && 'release --clean'
              || 'release --snapshot --clean' }}
        env:
          GR_TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums_*.txt
          if-no-files-found: error

  # On tags, collect every runner's archives and publish a single release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # for .github/scripts/update-homebrew-tap.sh

      - name: Download all dist artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Combine checksums
        run: cat dist/checksums_*.txt > dist/checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # goreleaser's brews pipe can't run here (the release is assembled by hand
      # across runners), so generate the formula from the published archives and
      # push it to emprcl/homebrew-tap.
      - name: Update Homebrew tap
        run: .github/scripts/update-homebrew-tap.sh
        env:
          VERSION: ${{ github.ref_name }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Publish the same archives to itch.io (emprcl/signls), one channel per platform.
      - name: Push to itch.io
        run: .github/scripts/push-to-itchio.sh
        env:
          VERSION: ${{ github.ref_name }}
          BUTLER_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
